

services:
  # Main application
  automation-platform:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: automation-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3

  # Database for state storage
  database:
    image: postgres:15-alpine
    container_name: automation-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: automation
      POSTGRES_USER: automation
      POSTGRES_PASSWORD: ${DB_PASSWORD:-automation_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U automation -d automation"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: automation-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # Task scheduler (Celery)
  celery-worker:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: automation-celery
    restart: unless-stopped
    command: celery -A automation.celery_app worker --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "celery", "-A", "automation.celery_app", "inspect", "ping"]
      start_period: 60s
      interval: 30s
      timeout: 10s
      retries: 3

  # Celery Beat for periodic tasks  
  celery-beat:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: automation-beat
    restart: unless-stopped
    command: celery -A automation.celery_app beat --loglevel=info
    environment:
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      disable: true

  # Nginx for reverse proxy and static files
  nginx:
    image: nginx:alpine
    container_name: automation-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      automation-platform:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  storage:
  logs:
